<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InoxSolutions | Cotizador de Barandas</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--primary);
    }

    header p {
      color: #64748b;
    }

    .card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      display: inline-block;
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .result-box {
      display: none;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 20px;
      border-radius: var(--radius);
      margin-top: 20px;
      text-align: center;
    }

    .result-box h3 {
      color: #1e40af;
      margin-bottom: 10px;
    }

    .price {
      font-size: 2rem;
      font-weight: bold;
      color: #1e3a8a;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>InoxSolutions</h1>
      <p>Cotizador en línea para barandas y estructuras en acero inoxidable</p>
    </header>

    <div class="card">
      <form id="cotizador-form">
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono / WhatsApp</label>
          <input type="tel" id="telefono" placeholder="Ej: +54 9 353 ..." required>
        </div>

        <div class="form-group">
          <label for="tipo">Tipo de Estructura / Baranda</label>
          <select id="tipo" required>
            <option value="">Selecciona una opción</option>
            <option value="baranda-varilla">Baranda con Varillas Horizontales</option>
            <option value="baranda-vidrio">Baranda con Cristales Templados</option>
            <option value="pasamanos">Pasamanos de Pared</option>
          </select>
        </div>

        <div class="form-group">
          <label for="metros">Metros lineales aproximados</label>
          <input type="number" id="metros" min="1" step="0.5" placeholder="Ej: 5.5" required>
        </div>

        <div class="form-group">
          <label for="mensaje">Detalles adicionales (Opcional)</label>
          <textarea id="mensaje" rows="3" placeholder="Ubicación, tipo de fijación, etc."></textarea>
        </div>

        <button type="submit" class="btn">Solicitar Cotización</button>
      </form>

      <div id="resultado" class="result-box">
        <h3>¡Cotización Estimada Lista!</h3>
        <p>El valor estimado para tu proyecto es de:</p>
        <div class="price" id="precio-estimado">$0</div>
        <p style="font-size: 0.85rem; color: #64748b; margin-top: 10px;">Un asesor se pondrá en contacto contigo a la brevedad para ajustar los detalles técnicos.</p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('cotizador-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const metros = parseFloat(document.getElementById('metros').value);
      const tipo = document.getElementById('tipo').value;
      let precioPorMetro = 0;

      switch(tipo) {
        case 'baranda-varilla':
          precioPorMetro = 150;
          break;
        case 'baranda-vidrio':
          precioPorMetro = 220;
          break;
        case 'pasamanos':
          precioPorMetro = 80;
          break;
        default:
          precioPorMetro = 100;
      }

      const total = metros * precioPorMetro;
      document.getElementById('precio-estimado').innerText = `$${total.toLocaleString()}`;
      document.getElementById('resultado').style.display = 'block';
    });
  </script>
</body>
</html>
